name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_ENV: test

jobs:
  # ===== LINTING & CODE QUALITY =====
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies (backend)
        run: cd backend && npm ci
      
      - name: Lint backend
        run: cd backend && npm run lint
        continue-on-error: true
      
      - name: Install dependencies (frontend)
        run: cd frontend && npm ci
      
      - name: Lint frontend
        run: cd frontend && npm run lint
        continue-on-error: true

  # ===== UNIT TESTS =====
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: ebdesign_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: cd backend && npm ci
      
      - name: Run tests
        run: cd backend && npm run test
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/ebdesign_test
          REDIS_URL: redis://localhost:6379
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: cd frontend && npm ci
      
      - name: Run tests
        run: cd frontend && npm run test
        continue-on-error: true

  # ===== BUILD VERIFICATION =====
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Build backend
        run: cd backend && npm install
        continue-on-error: true
      
      - name: Build frontend
        run: cd frontend && npm install && npm run build
        env:
          VITE_API_BASE_URL: https://api.ebdesign.local/api/v1

  # ===== SECURITY SCANNING =====
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Audit backend dependencies
        run: cd backend && npm audit --audit-level=moderate || true
      
      - name: Audit frontend dependencies
        run: cd frontend && npm audit --audit-level=moderate || true

  # ===== CLAUDE AI INTEGRATION TEST =====
  claude-ai-test:
    name: Claude AI Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Test Claude AI Coordinator
        run: cd backend && node -e "const coordinator = require('./src/core/claudeAICoordinator'); console.log('Claude AI Coordinator loaded successfully');"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true

  # ===== REQUIRE ALL CHECKS =====
  status:
    name: Check Status
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend, build, security, claude-ai-test]
    if: always()
    steps:
      - name: Verify CI passed
        run: |
          echo "CI Pipeline Results:"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Backend Tests: ${{ needs.test-backend.result }}"
          echo "Frontend Tests: ${{ needs.test-frontend.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Claude AI: ${{ needs.claude-ai-test.result }}"
          
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            echo "❌ Linting failed"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ Build failed"
            exit 1
          fi
          echo "✅ CI checks completed"