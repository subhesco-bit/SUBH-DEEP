version: '3.8'
# EBDESIGN Phase 2-3: Development Infrastructure
# Quick PostgreSQL + Redis setup for local development

services:
  # PostgreSQL Database - REQUIRED
  postgres:
    image: postgres:15-alpine
    container_name: ebdesign-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ebdesign_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ebdesign-dev

  # Redis Cache - Optional
  redis:
    image: redis:7-alpine
    container_name: ebdesign-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ebdesign-dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ebdesign-dev:
    driver: bridge
