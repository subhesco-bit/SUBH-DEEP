name: Clone M001-M050 Production Runtime
on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt-clone/main-reconciliation-phase-1'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:m001-m050:e2e
      - run: npm run lint
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
