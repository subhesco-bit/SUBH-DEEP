name: Clone M051-M100 E2E Verification
on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt-clone/main-reconciliation-phase-1'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:m051-m100:e2e
      - run: npm run lint
