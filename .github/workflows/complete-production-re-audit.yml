name: Complete Production Re-Audit

on:
  push:
    branches: [chatgpt-clone/foundation]
  pull_request:
    branches: [chatgpt-clone/foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  re-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run complete repository re-audit
        run: node tools/complete-production-re-audit.js

      - name: Upload audit manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-production-re-audit
          path: .ai/production-hardening/complete-re-audit/
          if-no-files-found: warn
