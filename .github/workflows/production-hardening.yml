name: Production Hardening And Trial Preview

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'codex/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: '20'
  NODE_ENV: test

jobs:
  repository-map:
    name: Repository Map And Hardening Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate complete file map
        run: node tools/codex-project-map.js

      - name: Generate junk and production hardening audit
        run: node tools/codex-hardening-audit.js

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-production-hardening-audit
          path: |
            docs/codex-file-map.csv
            docs/codex-project-map.json
            docs/codex-project-map.md
            docs/codex-junk-separation-plan.md
            docs/codex-junk-quarantine-manifest.csv
            docs/codex-production-hardening-audit.csv
            docs/codex-production-hardening-audit.json
            docs/codex-production-hardening-audit.md
          retention-days: 14

  backend:
    name: Backend Production Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: ebdesign_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Syntax check backend entrypoints
        run: |
          node --check src/index.js
          node --check src/services/legacy/aiCopilotService.js

      - name: Run backend tests
        run: npm test -- --runInBand
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/ebdesign_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-development-secret-change-before-production
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Backend dependency audit
        run: npm audit --audit-level=high

  frontend:
    name: Frontend Build And Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: https://api.ebdesign.example/api/v1

      - name: Frontend dependency audit
        run: npm audit --audit-level=high

  mobile-shell:
    name: Android Mobile Shell
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web assets for mobile shell
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: https://api.ebdesign.example/api/v1

      - name: Sync Capacitor Android shell
        run: npx cap sync android

  status:
    name: Hardening Gate Summary
    runs-on: ubuntu-latest
    needs:
      - repository-map
      - backend
      - frontend
      - mobile-shell
    if: always()
    steps:
      - name: Check all required jobs
        run: |
          echo "repository-map=${{ needs.repository-map.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "mobile-shell=${{ needs.mobile-shell.result }}"
          test "${{ needs.repository-map.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.mobile-shell.result }}" = "success"
