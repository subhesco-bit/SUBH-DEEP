name: System Completion Gate

on:
  push:
    branches:
      - 'chatgpt-clone/**'
  pull_request:
    branches:
      - 'chatgpt-clone/**'
      - main

jobs:
  completion-gate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: m001-m050-system-gate-only-jwt-secret-not-for-production-2026
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Portfolio system audit
        id: portfolio-audit
        continue-on-error: true
        run: npm run audit:system

      - name: Record portfolio audit status
        if: always()
        run: |
          echo "Portfolio audit outcome: ${{ steps.portfolio-audit.outcome }}"
          echo "Repository-wide findings remain visible while 50-module production batches are migrated and certified independently."

      - name: M001-M050 release reachability gate
        run: npm run audit:m001-m050

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test -- --runInBand
