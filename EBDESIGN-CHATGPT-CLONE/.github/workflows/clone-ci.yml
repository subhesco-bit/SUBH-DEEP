name: ChatGPT Clone CI

on:
  push:
    paths:
      - 'EBDESIGN-CHATGPT-CLONE/**'
      - 'backend/**'
  pull_request:
    paths:
      - 'EBDESIGN-CHATGPT-CLONE/**'
      - 'backend/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Test backend
        working-directory: backend
        run: npm test -- --runInBand

      - name: Validate clone manifests
        run: test -f EBDESIGN-CHATGPT-CLONE/README.md && test -f EBDESIGN-CHATGPT-CLONE/.ai/WORK_LOG.md && test -f EBDESIGN-CHATGPT-CLONE/MASTER_PROTOCOL.md
