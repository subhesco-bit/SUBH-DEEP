<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AFRERA - Empowering Rural India Through Technology" />

    <!-- PWA: makes the app installable and usable on an intermittent
         connection. The backend already had offlineSyncService and
         offlinePaymentService; without these tags none of that was reachable
         from the browser. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AFRERA" />

    <!-- Discoverability (Open Graph / Twitter) - previously absent entirely,
         so any shared link rendered with no title, description or image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AFRERA" />
    <meta property="og:title" content="AFRERA - Agriculture &amp; Rural Economy Platform" />
    <meta property="og:description" content="Marketplace, farmer services, logistics and insurance for rural India." />
    <meta property="og:image" content="https://afrera.platform/icons/icon-512.png" />
    <meta property="og:url" content="https://afrera.platform/" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AFRERA - Agriculture &amp; Rural Economy Platform" />
    <meta name="twitter:description" content="Marketplace, farmer services, logistics and insurance for rural India." />
    <meta name="twitter:image" content="https://afrera.platform/icons/icon-512.png" />
    <link rel="canonical" href="https://afrera.platform/" />

    <title>AFRERA Platform</title>

    <!-- JSON-LD Structured Data for Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AFRERA",
      "description": "Marketplace, farmer services, logistics and insurance for rural India",
      "url": "https://afrera.platform",
      "logo": "https://afrera.platform/icons/icon-512.png",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "areaServed": "IN",
        "availableLanguage": ["en", "hi", "bn", "as", "mni", "kha"]
      }
    }
    </script>

    <!-- JSON-LD Structured Data for WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AFRERA Platform",
      "url": "https://afrera.platform/",
      "description": "Empowering Rural India Through Technology",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://afrera.platform/marketplace?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- (2026-08-30) Removed this inline service-worker registration - its
         comment claimed a "production + support" guard that the actual
         condition below never implemented (plain <script> tags can't see
         import.meta.env), so it was registering the cache-first worker in
         `vite dev` too, same as the App.jsx effect duplicated it. That
         effect now carries the real import.meta.env.PROD guard and is the
         single registration point. -->
  </body>
</html>
