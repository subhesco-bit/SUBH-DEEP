version: '3.8'

# LOCAL DEV ONLY. Every ${VAR:-default} below falls back to a well-known,
# publicly-documented placeholder purely so `docker compose up` works out of
# the box on a laptop with no setup. These fallbacks must never be treated as
# real secrets and must never be reused in any shared/staging/production
# environment. To override locally, create a git-ignored `.env` file next to
# this compose file (backend/.env, already covered by the repo's .gitignore)
# with real local values - docker compose loads it automatically. In any
# non-local environment, secrets must come from a real secrets manager
# (e.g. AWS Secrets Manager / Vault / your platform's secret store), injected
# as real environment variables - never hardcoded here.
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: afrera-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afrera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afrera_password}
      POSTGRES_DB: ${POSTGRES_DB:-afrera_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "afrera"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afrera-network

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: afrera-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-afrera}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-afrera_password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-afrera_mongo}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afrera-network

  # Redis Cache
  redis:
    image: redis:7
    container_name: afrera-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afrera-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afrera-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${POSTGRES_DB:-afrera_db}
      PG_USER: ${POSTGRES_USER:-afrera}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-afrera_password}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-afrera}:${MONGO_INITDB_ROOT_PASSWORD:-afrera_password}@mongodb:27017/${MONGO_INITDB_DATABASE:-afrera_mongo}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-in-production}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      FRONTEND_URL: http://localhost:3000
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - /app/node_modules
    networks:
      - afrera-network
    restart: unless-stopped

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: afrera-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-afrera}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-afrera_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afrera-network

  # Elasticsearch
  # DEV-ONLY: xpack.security.enabled=false runs this node with no auth at all.
  # That is only acceptable because the port below is bound to 127.0.0.1 (not
  # reachable from outside this machine) and this compose file is local-dev
  # only. Never disable security like this, and never publish 9200 to
  # 0.0.0.0, in any shared/staging/production compose or deployment file -
  # enable xpack.security and put Elasticsearch behind real auth there.
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: afrera-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afrera-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:

networks:
  afrera-network:
    driver: bridge
