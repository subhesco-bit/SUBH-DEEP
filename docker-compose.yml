# EBDESIGN Production Docker Compose
# Single canonical file for all deployment scenarios
# 
# USAGE:
#   docker compose up -d                     # postgres + redis (dev baseline)
#   docker compose --profile tools up -d     # + pgAdmin on :5050
#   docker compose --profile full up -d      # + mongodb, rabbitmq, elasticsearch
#   docker compose --profile app up -d       # + backend & frontend dev images
#   docker compose --profile prod up -d      # PRODUCTION: combined app + nginx + ssl

name: ebdesign

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-ebdesign}
  POSTGRES_USER: ${POSTGRES_USER:-ebdesign_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebdesign_dev_password_change_in_prod}

services:
  # ── Canonical PostgreSQL Datastore ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ebdesign-postgres
    restart: unless-stopped
    environment: *postgres-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/migrations:ro
    networks:
      - ebdesign
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-ebdesign_user} -d ${POSTGRES_DB:-ebdesign}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Redis Cache & Session Store ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ebdesign-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── pgAdmin Database GUI (profile: tools) ──────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ebdesign-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ebdesign.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ebdesign

  # ── MongoDB (profile: full) ────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: ebdesign-mongodb
    profiles: ["full"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-ebdesign_mongo}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ Message Broker (profile: full) ────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ebdesign-rabbitmq
    profiles: ["full"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ebdesign_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ebdesign_dev_password_change_in_prod}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Elasticsearch Search Engine (profile: full) ────────────────────────────
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: ebdesign-elasticsearch
    profiles: ["full"]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Dev Profile) ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ebdesign-backend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ebdesign_user}:${POSTGRES_PASSWORD:-ebdesign_dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-ebdesign}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      FRONTEND_URL: http://localhost:3000
      LOG_LEVEL: debug
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/logs:/app/logs
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend (Dev Profile) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ebdesign-frontend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Combined App (Production Profile) ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebdesign-app
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ebdesign_user}:${POSTGRES_PASSWORD:-ebdesign_dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-ebdesign}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      MONGODB_URL: mongodb://mongodb:27017/${MONGO_DB:-ebdesign_mongo}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ebdesign_user}:${RABBITMQ_PASSWORD:-ebdesign_dev_password_change_in_prod}@rabbitmq:5672
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOG_LEVEL: info
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Nginx Reverse Proxy with SSL/TLS (Production Profile) ───────────────────
  nginx:
    image: nginx:alpine
    container_name: ebdesign-nginx
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      - TZ=UTC
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ════════════════════════════════════════════════════════════════════════════════
# VOLUMES
# ════════════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  rabbitmq_data:
    driver: local
  elasticsearch_data:
    driver: local
  nginx_logs:
    driver: local
  nginx_cache:
    driver: local

# ════════════════════════════════════════════════════════════════════════════════
# NETWORKS
# ════════════════════════════════════════════════════════════════════════════════
networks:
  ebdesign:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
