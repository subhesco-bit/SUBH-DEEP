# EBDESIGN — single canonical compose file.
#
# WHY THIS REPLACED FIVE FILES
#
# The repo previously carried docker-compose.yml, .dev.yml, .full.yml,
# .database.yml and -postgres.yml. Each created its own PostgreSQL with a
# different database name, user, port mapping and volume:
#
#   afrera_prod / afrera_user   :5432   postgres_data
#   ebdesign_db / postgres      :5432   postgres_data
#   ebdesign_db / postgres      :5432   postgres_data      (different network)
#   subh_dev    / subh_admin    :5432   subh_postgres_data (postgres 16)
#   ebdesign    / ebdesign_user :15432  postgres_data
#
# All five bound host port 5432 or 15432, so only one could run at a time, and
# whichever you happened to start decided where migrations landed. Two of them
# even shared the container name `ebdesign-postgres` while pointing at
# different databases.
#
# There is now exactly one PostgreSQL. Optional services live behind profiles
# instead of behind separate files, so they can never drift into declaring a
# second database.
#
# USAGE
#   docker compose up -d                     # postgres + redis (what dev needs)
#   docker compose --profile tools up -d     # + pgAdmin on :5050
#   docker compose --profile full up -d      # + mongodb, rabbitmq, elasticsearch
#   docker compose --profile app up -d       # + backend & frontend dev images
#   docker compose --profile prod up -d      # combined production image + nginx
#
# The canonical identity below must stay in step with backend/.env.example and
# backend/src/config/database.js (CANONICAL_DEFAULTS).

name: ebdesign

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-ebdesign}
  POSTGRES_USER: ${POSTGRES_USER:-ebdesign_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebdesign_dev_password_change_in_prod}

services:
  # ── Canonical datastore ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ebdesign-postgres
    restart: unless-stopped
    environment: *postgres-env
    ports:
      # Host port is configurable so a pre-existing local PostgreSQL on 5432
      # does not force you to edit this file. Container port is always 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Bootstrap SQL, applied only on first initialisation of an empty volume.
      - ./database/docker/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ebdesign
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-ebdesign_user} -d ${POSTGRES_DB:-ebdesign}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ebdesign-redis
    restart: unless-stopped
    # appendonly keeps cache/session state across restarts; without it a
    # container restart silently logs every user out.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Database tooling (profile: tools) ─────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ebdesign-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ebdesign.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ebdesign

  # ── Optional engines (profile: full) ──────────────────────────────────────
  # These are opt-in because the platform does not currently require them:
  # MongoDB has exactly one consumer (aiBackboneService, fraud patterns) and
  # Elasticsearch has no wired consumer at all. Running them by default only
  # produces "service not available" noise.
  mongodb:
    image: mongo:7
    container_name: ebdesign-mongodb
    profiles: ["full"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-ebdesign_mongo}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ebdesign-rabbitmq
    profiles: ["full"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ebdesign_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ebdesign_dev_password_change_in_prod}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: ebdesign-elasticsearch
    profiles: ["full"]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application, development images (profile: app) ────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ebdesign-backend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # Inside the network the service name is the host and the port is always
      # 5432 — POSTGRES_PORT only affects the host-side mapping.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ebdesign_user}:${POSTGRES_PASSWORD:-ebdesign_dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-ebdesign}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ebdesign-frontend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ebdesign
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Application, combined production image (profile: prod) ────────────────
  # The root Dockerfile builds frontend and backend into one image serving on
  # 3001. Kept distinct from the `app` profile, which uses the separate
  # per-directory dev Dockerfiles with bind mounts.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebdesign-app
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ebdesign_user}:${POSTGRES_PASSWORD:-ebdesign_dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-ebdesign}
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://mongodb:27017/${MONGO_DB:-ebdesign_mongo}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ebdesign_user}:${RABBITMQ_PASSWORD:-ebdesign_dev_password_change_in_prod}@rabbitmq:5672
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ebdesign
    healthcheck:
      # Must stay in the quoted flow form: the ternary's " : " would otherwise
      # be read as a YAML mapping rather than as part of the command string.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: ebdesign-nginx
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - ebdesign

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  rabbitmq_data:
  elasticsearch_data:

networks:
  ebdesign:
    driver: bridge
