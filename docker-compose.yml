services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: afrera-postgres
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: afrera_prod
      POSTGRES_USER: afrera_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - afrera-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afrera_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: afrera-mongodb
    env_file:
      - .env.docker
    environment:
      MONGO_INITDB_DATABASE: afrera_mongo_prod
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - afrera-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: afrera-redis
    env_file:
      - .env.docker
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - afrera-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: afrera-rabbitmq
    env_file:
      - .env.docker
    environment:
      RABBITMQ_DEFAULT_USER: afrera_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - afrera-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: afrera-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - afrera-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afrera-backend
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://afrera_user:${POSTGRES_PASSWORD}@postgres:5432/afrera_prod
      - MONGODB_URL=mongodb://mongodb:27017/afrera_mongo_prod
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - RABBITMQ_URL=amqp://afrera_user:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - afrera-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: afrera-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - afrera-network
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:

networks:
  afrera-network:
    driver: bridge
