events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  
  # Performance & Security
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 50M;
  
  # Logging
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;
  
  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_types text/plain text/css text/xml text/javascript 
             application/x-javascript application/xml+rss 
             application/json application/javascript;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

  # Upstream backend
  upstream ebdesign_backend {
    least_conn;
    server app:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # ════════════════════════════════════════════════════════════
  # HTTP Redirect to HTTPS (Production Security)
  # ════════════════════════════════════════════════════════════
  server {
    listen 80;
    server_name _;
    
    # Let's Encrypt ACME challenges pass through
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ════════════════════════════════════════════════════════════
  # HTTPS Server (Port 443 - Production Ready)
  # ════════════════════════════════════════════════════════════
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ── SSL/TLS Configuration ──────────────────────────────────
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    
    # Modern TLS: 1.2+ only (drop TLS 1.0/1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # OCSP stapling (if applicable)
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # HSTS: Tell browsers to always use HTTPS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Security Headers ───────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'" always;

    # Root directory
    root /usr/share/nginx/html;
    index index.html;

    # ── Health Check Endpoints ─────────────────────────────────
    location = /health {
      access_log off;
      proxy_pass http://ebdesign_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location = /health/ready {
      access_log off;
      proxy_pass http://ebdesign_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location = /health/live {
      access_log off;
      proxy_pass http://ebdesign_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # ── API Proxy (Backend) ────────────────────────────────────
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;
      
      proxy_pass http://ebdesign_backend;
      proxy_http_version 1.1;
      
      # Connection pooling
      proxy_set_header Connection "";
      proxy_buffering off;
      
      # Headers for upstream server
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      
      # Timeouts
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      
      # WebSocket support
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # ── WebSocket Support ──────────────────────────────────────
    location /socket.io/ {
      proxy_pass http://ebdesign_backend/socket.io/;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static Assets (Frontend) ───────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # ── SPA Routing (React/Vue) ────────────────────────────────
    location / {
      limit_req zone=general_limit burst=50 nodelay;
      
      # SPA fallback: All requests → index.html (except static assets)
      try_files $uri $uri/ /index.html;
      
      # Cache busting for index.html
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      expires -1;
    }

    # ── Deny Access to Sensitive Files ────────────────────────
    location ~ /\. {
      deny all;
      access_log off;
    }

    location ~ ~$ {
      deny all;
      access_log off;
    }

    # ── Error Pages ────────────────────────────────────────────
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
